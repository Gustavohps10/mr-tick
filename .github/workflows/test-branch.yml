name: Test Branch Pipeline (Temporary)

on:
  push:
    branches:
      - fix/providers-and-addons-standardization
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: checks

      - name: Typecheck
        run: yarn typecheck --summarize

      - name: Run Unit Tests
        run: yarn test:unit --summarize

      - name: Run UI Tests
        run: yarn test:ui --summarize

      - name: Build
        run: yarn build --summarize

      - name: Upload Turbo Run Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summaries-test
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore

  build-e2e:
    name: Build Desktop for E2E
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: desktop

      - name: Build Desktop App
        run: yarn turbo run build --concurrency=100% --filter=@mr-tick/desktop --filter=@mr-tick/datasource-fake --summarize

      - name: Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-build-branch
          path: |
            src/apps/desktop/out
            src/packages/*/dist
            src/apps/sdk/dist
            src/dev-addons/datasource-fake/dist
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Upload Turbo Run Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summaries-build-e2e
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-End Tests (Desktop) (${{ matrix.shard }}/6)
    needs: [build-e2e]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Download Desktop Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-e2e-build-branch
          path: src

      - name: Link Test Addon
        run: yarn addon:link datasource-fake

      - name: Run E2E Tests
        run: yarn --cwd src/apps/desktop test:e2e --retries=1 --shard=${{ matrix.shard }}/6

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-branch-shard-${{ matrix.shard }}
          path: src/apps/desktop/playwright-report/
          retention-days: 7
          compression-level: 1
