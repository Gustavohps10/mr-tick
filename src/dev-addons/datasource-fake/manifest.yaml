id: mr-tick-datasource-fake
name: DataSource Fake (Testes)
version: 1.1.2
requiredApiVersion: '-1'
categories:
  - auth
  - dataSource
  - theme
  - watcher
author: Mr-tick
shortDescription: Datasource mock para testes
description: Datasource com dados locais fixos (1000 tarefas, 1000 apontamentos) para testes e validação de envio de dados.
tags:
  - teste
  - mock
  - dataSource
  - desenvolvimento
  - theme
capabilities:
  - capabilityId: fake-datasource
    kind: dataSource
    contractVersion: 1.0.0
    required: true
    executionPolicy:
      kind: independent
    authRequirement:
      kind: required
      connectionProfileId: fake-main
      authorizationRole: primary
    supportedOperations:
      - read
      - write
      - findByCorrelation
      - updateConditional
      - getMappingFields
    settingsSchemaScope: connection
  - capabilityId: watcher
    kind: watcher
    contractVersion: 1.0.0
    required: false
    executionPolicy:
      kind: activeWorkspace
    authRequirement:
      kind: none
    supportedOperations:
      - read
      - write
    settingsSchemaScope: capability
  - capabilityId: fake-matrix-theme
    kind: theme
    contractVersion: 1.0.0
    required: false
    executionPolicy:
      kind: independent
    authRequirement:
      kind: none
    supportedOperations:
      - read
